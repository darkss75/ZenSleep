
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZenSleep</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f0f9ff" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Babel for In-browser Transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "recharts": "https://esm.sh/recharts@2.13.3?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; height: 100%; overflow: hidden; }
      .app-container { width: 100%; max-width: 414px; height: 100%; max-height: 896px; background: white; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; position: relative; display: flex; flex-direction: column; }
      @media (max-width: 450px) { .app-container { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; } }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .loading-spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #47c2eb; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
        <div class="loading-spinner"></div>
        <p id="loading-text" style="color: #94a3b8; font-weight: 600; font-family: sans-serif;">Initializing ZenSleep...</p>
      </div>
    </div>

    <!-- Bootstrap Script: Fixes GitHub Pages MIME issue by fetching as text and transpiling -->
    <script type="module">
      async function bootstrap() {
        const loadingText = document.getElementById('loading-text');
        try {
          loadingText.innerText = "Loading application code...";
          const response = await fetch('./index.tsx');
          if (!response.ok) throw new Error(`Failed to fetch index.tsx: ${response.status}`);
          
          const code = await response.text();
          loadingText.innerText = "Transpiling components...";
          
          const transpiled = Babel.transform(code, {
            presets: ['react', ['typescript', { isTSX: true, allExtensions: true }]],
            filename: 'index.tsx'
          }).code;

          loadingText.innerText = "Launching app...";
          const blob = new Blob([transpiled], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          await import(url);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("Bootstrap error:", err);
          document.getElementById('root').innerHTML = `
            <div style="padding: 20px; text-align: center;">
              <h2 style="color: #ef4444;">Launch Failed</h2>
              <p style="color: #64748b;">${err.message}</p>
              <button onclick="location.reload()" style="margin-top: 10px; padding: 8px 16px; background: #47c2eb; color: white; border-radius: 8px;">Retry</button>
            </div>
          `;
        }
      }
      bootstrap();
    </script>
  </body>
</html>
